name: manga-reader
services:
  manga-reader:
    build:
      context: .
      args:
        GIT_BRANCH: ${GIT_BRANCH:-unknown}
        GIT_SHA: ${GIT_SHA:-unknown}
    image: manga-reader:local
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      COOKIE_SECURE: "false"
    volumes:
      - /path/to/manga:/manga:ro
      - ./.data:/data
      - ./.processed:/processed
